<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reset password | Leave Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <style>
      :root {
        --bg: #f5f7fa;
        --bg-card: #ffffff;
        --text: #1a2332;
        --muted: #718096;
        --accent: #0066b3;
        --accent-hover: #004d8c;
        --border-subtle: #e2e8f0;
        --danger: #c53030;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      }
      .login-card {
        width: min(420px, calc(100vw - 32px));
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        padding: 28px 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
      }
      .subtitle {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.4;
      }
      label {
        display: block;
        font-size: 0.85rem;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid var(--border-subtle);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 14px;
        font: inherit;
      }
      button {
        width: 100%;
        border: none;
        border-radius: 8px;
        padding: 11px 14px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: var(--accent-hover);
      }
      .error {
        display: none;
        color: var(--danger);
        margin: 0 0 12px;
        font-size: 0.9rem;
        white-space: pre-line;
      }
      .success {
        display: none;
        color: #276749;
        margin: 0 0 12px;
        font-size: 0.9rem;
      }
      .back-link {
        display: inline-block;
        margin-top: 16px;
        font-size: 0.9rem;
        color: var(--accent);
        text-decoration: none;
      }
      .back-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h1 id="page-title">Choose a new password</h1>
      <p class="subtitle">Enter a new password for your Leave Manager account.</p>
      <div id="form-error" class="error"></div>
      <div id="form-success" class="success"></div>
      <form id="reset-form">
        <label for="new-password">New password</label>
        <input id="new-password" type="password" required minlength="8" autocomplete="new-password" />
        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" type="password" required minlength="8" autocomplete="new-password" />
        <button type="submit">Save new password</button>
      </form>
      <a class="back-link" href="/login.html">Back to sign in</a>
    </div>
    <script>
      function showError(msg) {
        const el = document.getElementById("form-error");
        const ok = document.getElementById("form-success");
        ok.style.display = "none";
        ok.textContent = "";
        if (!msg) {
          el.style.display = "none";
          el.textContent = "";
          return;
        }
        el.textContent = msg;
        el.style.display = "block";
      }

      function showSuccess(msg) {
        const el = document.getElementById("form-success");
        const err = document.getElementById("form-error");
        err.style.display = "none";
        err.textContent = "";
        el.textContent = msg;
        el.style.display = "block";
      }

      async function loadBrand() {
        try {
          const res = await fetch("/config/brand.json", { cache: "no-store" });
          if (!res.ok) return;
          const brand = await res.json();
          const title = brand.pageTitle || brand.productName || "Leave Manager";
          document.title = "Reset password | " + title;
          if (brand.accentColor) document.documentElement.style.setProperty("--accent", brand.accentColor);
          if (brand.accentHover) document.documentElement.style.setProperty("--accent-hover", brand.accentHover);
        } catch {}
      }

      const params = new URLSearchParams(window.location.search);
      const token = params.get("token") || "";
      if (!token) {
        showError("This reset link is missing or incomplete. Request a new one from the sign-in page.");
        document.getElementById("reset-form").style.display = "none";
      }

      document.getElementById("reset-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        showError("");
        const password = document.getElementById("new-password").value;
        const confirmPassword = document.getElementById("confirm-password").value;
        if (password !== confirmPassword) {
          showError("New password and confirmation do not match.");
          return;
        }
        try {
          const res = await fetch("/api/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, password, confirmPassword }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Could not reset password.");
          showSuccess(data.message || "Password updated. You can sign in now.");
          document.getElementById("reset-form").style.display = "none";
          setTimeout(() => {
            window.location.href = "/login.html";
          }, 1500);
        } catch (err) {
          showError(err.message || "Could not reset password.");
        }
      });

      loadBrand();
    </script>
  </body>
</html>
